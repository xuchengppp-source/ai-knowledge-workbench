<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的洞察 · 徐总知识库</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
  background:linear-gradient(135deg,#0a0a1a 0%,#1a1a3e 50%,#0d0d2b 100%); color:#fff; min-height:100vh; }

.header { position:fixed; top:0; left:0; right:0; z-index:100; padding:14px 24px;
  background:rgba(10,10,26,0.9); backdrop-filter:blur(10px); border-bottom:1px solid rgba(255,255,255,0.08);
  display:flex; justify-content:space-between; align-items:center; }
.header h1 { font-size:17px; font-weight:700; background:linear-gradient(90deg,#fbbf24,#f97316,#ef4444); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.header-actions { display:flex; gap:8px; align-items:center; }
.btn { padding:7px 14px; border-radius:8px; border:1px solid rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.06); color:#fff; font-size:12px; cursor:pointer; text-decoration:none;
  transition:all 0.2s; }
.btn:hover { background:rgba(255,255,255,0.12); }
.btn-primary { background:linear-gradient(135deg,#fbbf24,#f97316); border:none; color:#1a1a3e; font-weight:700; }
.btn-primary:hover { transform:scale(1.05); }
.btn-danger { background:rgba(239,68,68,0.2); border-color:rgba(239,68,68,0.3); color:#fca5a5; }

.container { max-width:900px; margin:0 auto; padding:80px 24px 40px; }

.stats-bar { display:flex; gap:16px; margin-bottom:24px; flex-wrap:wrap; }
.stat-card { flex:1; min-width:120px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08);
  border-radius:12px; padding:16px; text-align:center; }
.stat-card .num { font-size:28px; font-weight:800; background:linear-gradient(90deg,#fbbf24,#f97316); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.stat-card .label { font-size:11px; color:rgba(255,255,255,0.5); margin-top:4px; }

.insight-card { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08);
  border-radius:14px; padding:18px; margin-bottom:14px; transition:all 0.2s; position:relative; }
.insight-card:hover { background:rgba(255,255,255,0.06); border-color:rgba(251,191,36,0.3); }
.insight-card .card-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
.insight-card .title { font-size:15px; font-weight:700; color:#fbbf24; flex:1; }
.insight-card .priority { display:inline-block; padding:3px 10px; border-radius:6px; font-size:10px; font-weight:700; margin-left:10px; white-space:nowrap; }
.priority-high { background:rgba(239,68,68,0.2); color:#fca5a5; }
.priority-medium { background:rgba(251,191,36,0.2); color:#fcd34d; }
.priority-low { background:rgba(107,203,119,0.2); color:#86efac; }
.insight-card .content { font-size:13px; line-height:1.8; color:rgba(255,255,255,0.75); margin-bottom:12px; white-space:pre-wrap; }
.insight-card .tags { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
.insight-card .tag { padding:2px 8px; border-radius:4px; font-size:10px; background:rgba(123,47,247,0.2); color:#c4b5fd; }
.insight-card .card-footer { display:flex; justify-content:space-between; align-items:center; }
.insight-card .date { font-size:10px; color:rgba(255,255,255,0.35); }
.insight-card .card-actions { display:flex; gap:6px; }
.insight-card .action-btn { padding:4px 10px; border-radius:6px; font-size:10px; cursor:pointer;
  background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); color:rgba(255,255,255,0.6); }
.insight-card .action-btn:hover { background:rgba(255,255,255,0.12); color:#fff; }

.empty-state { text-align:center; padding:80px 20px; color:rgba(255,255,255,0.3); }
.empty-state .icon { font-size:48px; margin-bottom:16px; }
.empty-state .text { font-size:14px; }

/* Modal */
.modal-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; z-index:200;
  background:rgba(0,0,0,0.7); backdrop-filter:blur(4px); justify-content:center; align-items:center; }
.modal-overlay.active { display:flex; }
.modal { background:#1a1a3e; border:1px solid rgba(255,255,255,0.1); border-radius:16px;
  width:90%; max-width:560px; max-height:85vh; overflow-y:auto; padding:24px; }
.modal h2 { font-size:16px; font-weight:700; margin-bottom:20px; color:#fbbf24; }
.form-group { margin-bottom:16px; }
.form-group label { display:block; font-size:12px; color:rgba(255,255,255,0.6); margin-bottom:6px; }
.form-group input, .form-group textarea, .form-group select {
  width:100%; padding:10px 12px; border-radius:8px; border:1px solid rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.06); color:#fff; font-size:13px; font-family:inherit; }
.form-group input:focus, .form-group textarea:focus, .form-group select:focus {
  outline:none; border-color:#fbbf24; }
.form-group textarea { min-height:120px; resize:vertical; line-height:1.6; }
.modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:20px; }

.filter-bar { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; align-items:center; }
.filter-bar .filter-label { font-size:12px; color:rgba(255,255,255,0.4); }
.filter-btn { padding:5px 12px; border-radius:6px; font-size:11px; cursor:pointer;
  background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); color:rgba(255,255,255,0.6); }
.filter-btn.active { background:rgba(251,191,36,0.2); border-color:rgba(251,191,36,0.4); color:#fbbf24; }
</style>
</head>
<body>

<div class="header">
  <h1>💡 我的洞察</h1>
  <div class="header-actions">
    <button class="btn" onclick="exportData()">📤 导出</button>
    <button class="btn" onclick="importData()">📥 导入</button>
    <button class="btn btn-primary" onclick="openModal()">+ 新增洞察</button>
    <a href="index.html" class="btn">← 返回</a>
  </div>
</div>

<div class="container">
  <div class="stats-bar">
    <div class="stat-card"><div class="num" id="totalCount">0</div><div class="label">总洞察</div></div>
    <div class="stat-card"><div class="num" id="highCount">0</div><div class="label">高关注</div></div>
    <div class="stat-card"><div class="num" id="mediumCount">0</div><div class="label">中关注</div></div>
    <div class="stat-card"><div class="num" id="lowCount">0</div><div class="label">低关注</div></div>
  </div>

  <div class="filter-bar">
    <span class="filter-label">筛选：</span>
    <button class="filter-btn active" onclick="filterByPriority('all', this)">全部</button>
    <button class="filter-btn" onclick="filterByPriority('high', this)">🔴 高关注</button>
    <button class="filter-btn" onclick="filterByPriority('medium', this)">🟡 中关注</button>
    <button class="filter-btn" onclick="filterByPriority('low', this)">🟢 低关注</button>
  </div>

  <div id="insightsList"></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">新增洞察</h2>
    <div class="form-group">
      <label>标题 *</label>
      <input type="text" id="inputTitle" placeholder="一句话概括这个洞察">
    </div>
    <div class="form-group">
      <label>内容 *</label>
      <textarea id="inputContent" placeholder="详细描述你的洞察、思考、关注的点..."></textarea>
    </div>
    <div class="form-group">
      <label>标签（用逗号分隔）</label>
      <input type="text" id="inputTags" placeholder="例如：AI, 商业化, FDE">
    </div>
    <div class="form-group">
      <label>关注程度</label>
      <select id="inputPriority">
        <option value="high">🔴 高关注</option>
        <option value="medium" selected>🟡 中关注</option>
        <option value="low">🟢 低关注</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveInsight()">保存</button>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept=".json" style="display:none" onchange="handleFileImport(event)">

<script>
const STORAGE_KEY = 'my_insights_v1';
let insights = [];
let editingId = null;
let currentFilter = 'all';

function loadData() {
  try {
    const data = localStorage.getItem(STORAGE_KEY);
    insights = data ? JSON.parse(data) : [];
  } catch(e) {
    insights = [];
  }
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(insights));
}

function render() {
  const list = document.getElementById('insightsList');
  const filtered = currentFilter === 'all' ? insights : insights.filter(i => i.priority === currentFilter);
  const sorted = filtered.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));

  // 统计
  document.getElementById('totalCount').textContent = insights.length;
  document.getElementById('highCount').textContent = insights.filter(i => i.priority === 'high').length;
  document.getElementById('mediumCount').textContent = insights.filter(i => i.priority === 'medium').length;
  document.getElementById('lowCount').textContent = insights.filter(i => i.priority === 'low').length;

  if (sorted.length === 0) {
    list.innerHTML = `<div class="empty-state">
      <div class="icon">💡</div>
      <div class="text">还没有洞察，点击右上角「+ 新增洞察」开始记录</div>
    </div>`;
    return;
  }

  list.innerHTML = sorted.map(item => `
    <div class="insight-card">
      <div class="card-header">
        <div class="title">${escapeHtml(item.title)}</div>
        <span class="priority priority-${item.priority}">${priorityLabel(item.priority)}</span>
      </div>
      <div class="content">${escapeHtml(item.content)}</div>
      ${item.tags && item.tags.length ? `<div class="tags">${item.tags.map(t => `<span class="tag">#${escapeHtml(t)}</span>`).join('')}</div>` : ''}
      <div class="card-footer">
        <span class="date">${formatDate(item.createdAt)}${item.updatedAt ? ' · 更新于 ' + formatDate(item.updatedAt) : ''}</span>
        <div class="card-actions">
          <button class="action-btn" onclick="editInsight('${item.id}')">编辑</button>
          <button class="action-btn" onclick="deleteInsight('${item.id}')">删除</button>
        </div>
      </div>
    </div>
  `).join('');
}

function openModal(id = null) {
  editingId = id;
  document.getElementById('modalTitle').textContent = id ? '编辑洞察' : '新增洞察';
  if (id) {
    const item = insights.find(i => i.id === id);
    if (item) {
      document.getElementById('inputTitle').value = item.title;
      document.getElementById('inputContent').value = item.content;
      document.getElementById('inputTags').value = item.tags ? item.tags.join(', ') : '';
      document.getElementById('inputPriority').value = item.priority;
    }
  } else {
    document.getElementById('inputTitle').value = '';
    document.getElementById('inputContent').value = '';
    document.getElementById('inputTags').value = '';
    document.getElementById('inputPriority').value = 'medium';
  }
  document.getElementById('modalOverlay').classList.add('active');
  setTimeout(() => document.getElementById('inputTitle').focus(), 100);
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
  editingId = null;
}

function saveInsight() {
  const title = document.getElementById('inputTitle').value.trim();
  const content = document.getElementById('inputContent').value.trim();
  const tagsStr = document.getElementById('inputTags').value.trim();
  const priority = document.getElementById('inputPriority').value;

  if (!title || !content) {
    alert('标题和内容不能为空');
    return;
  }

  const tags = tagsStr ? tagsStr.split(/[,，]/).map(t => t.trim()).filter(t => t) : [];

  if (editingId) {
    const item = insights.find(i => i.id === editingId);
    if (item) {
      item.title = title;
      item.content = content;
      item.tags = tags;
      item.priority = priority;
      item.updatedAt = new Date().toISOString();
    }
  } else {
    insights.push({
      id: Date.now().toString(36) + Math.random().toString(36).substr(2,5),
      title, content, tags, priority,
      createdAt: new Date().toISOString()
    });
  }

  saveData();
  render();
  closeModal();
}

function editInsight(id) { openModal(id); }

function deleteInsight(id) {
  if (!confirm('确定删除这个洞察吗？')) return;
  insights = insights.filter(i => i.id !== id);
  saveData();
  render();
}

function filterByPriority(priority, btn) {
  currentFilter = priority;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function exportData() {
  const dataStr = JSON.stringify(insights, null, 2);
  const blob = new Blob([dataStr], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `my-insights-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData() {
  document.getElementById('fileInput').click();
}

function handleFileImport(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (Array.isArray(data)) {
        if (confirm(`导入 ${data.length} 条洞察？将合并到现有数据中。`)) {
          const existingIds = new Set(insights.map(i => i.id));
          data.forEach(item => {
            if (item.id && !existingIds.has(item.id)) {
              insights.push(item);
            }
          });
          saveData();
          render();
          alert('导入成功');
        }
      } else {
        alert('文件格式不正确');
      }
    } catch(err) {
      alert('解析失败：' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatDate(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function priorityLabel(p) {
  return {high:'🔴 高', medium:'🟡 中', low:'🟢 低'}[p] || p;
}

// 点击遮罩关闭
document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ESC 关闭
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModal();
});

// 初始化
loadData();
render();
</script>
</body>
</html>
