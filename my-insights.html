<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的洞察 · 徐总知识库</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
  background:linear-gradient(135deg,#0a0a1a 0%,#1a1a3e 50%,#0d0d2b 100%); color:#fff; min-height:100vh; }

.header { position:fixed; top:0; left:0; right:0; z-index:100; padding:14px 24px;
  background:rgba(10,10,26,0.9); backdrop-filter:blur(10px); border-bottom:1px solid rgba(255,255,255,0.08);
  display:flex; justify-content:space-between; align-items:center; }
.header h1 { font-size:17px; font-weight:700; background:linear-gradient(90deg,#fbbf24,#f97316,#ef4444); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.header .sync-info { font-size:11px; color:rgba(255,255,255,0.4); }
.back-btn { padding:7px 14px; border-radius:8px; border:1px solid rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.06); color:#fff; font-size:12px; cursor:pointer; text-decoration:none; }

.container { max-width:900px; margin:0 auto; padding:80px 24px 40px; }

.stats-bar { display:flex; gap:16px; margin-bottom:24px; flex-wrap:wrap; }
.stat-card { flex:1; min-width:120px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08);
  border-radius:12px; padding:16px; text-align:center; }
.stat-card .num { font-size:28px; font-weight:800; background:linear-gradient(90deg,#fbbf24,#f97316); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.stat-card .label { font-size:11px; color:rgba(255,255,255,0.5); margin-top:4px; }

.insight-card { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08);
  border-radius:14px; padding:18px; margin-bottom:14px; transition:all 0.2s; cursor:pointer; }
.insight-card:hover { background:rgba(255,255,255,0.06); border-color:rgba(251,191,36,0.3); transform:translateY(-2px); }
.insight-card .card-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
.insight-card .title { font-size:15px; font-weight:700; color:#fbbf24; flex:1; }
.insight-card .priority { display:inline-block; padding:3px 10px; border-radius:6px; font-size:10px; font-weight:700; margin-left:10px; white-space:nowrap; }
.priority-high { background:rgba(239,68,68,0.2); color:#fca5a5; }
.priority-medium { background:rgba(251,191,36,0.2); color:#fcd34d; }
.priority-low { background:rgba(107,203,119,0.2); color:#86efac; }
.insight-card .content { font-size:13px; line-height:1.8; color:rgba(255,255,255,0.75); margin-bottom:12px; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
.insight-card .tags { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
.insight-card .tag { padding:2px 8px; border-radius:4px; font-size:10px; background:rgba(123,47,247,0.2); color:#c4b5fd; }
.insight-card .card-footer { display:flex; justify-content:space-between; align-items:center; }
.insight-card .date { font-size:10px; color:rgba(255,255,255,0.35); }
.insight-card .word-count { font-size:10px; color:rgba(255,255,255,0.3); }

.empty-state { text-align:center; padding:80px 20px; color:rgba(255,255,255,0.3); }
.empty-state .icon { font-size:48px; margin-bottom:16px; }
.empty-state .text { font-size:14px; }

.loading { text-align:center; padding:60px; color:rgba(255,255,255,0.4); }

/* 详情面板 */
.detail-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.7); z-index:200; display:none; }
.detail-overlay.active { display:block; }
.detail-panel { position:fixed; top:0; right:0; bottom:0; width:100%; max-width:720px; background:linear-gradient(135deg,#0f0f2a 0%,#1a1a3e 100%); z-index:201;
  transform:translateX(100%); transition:transform 0.3s ease; overflow-y:auto; }
.detail-panel.active { transform:translateX(0); }
.detail-header { position:sticky; top:0; padding:16px 24px; background:rgba(15,15,42,0.95); backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(255,255,255,0.08); display:flex; justify-content:space-between; align-items:center; z-index:1; }
.detail-header .close-btn { padding:6px 14px; border-radius:8px; border:1px solid rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.06); color:#fff; font-size:12px; cursor:pointer; }
.detail-header .detail-title { font-size:15px; font-weight:700; color:#fbbf24; flex:1; margin-right:12px; }
.detail-body { padding:24px; color:rgba(255,255,255,0.85); line-height:1.9; font-size:14px; }
.detail-body h1 { font-size:22px; color:#fbbf24; margin-bottom:16px; }
.detail-body h2 { font-size:17px; color:#fcd34d; margin:24px 0 12px; border-left:3px solid #fbbf24; padding-left:10px; }
.detail-body h3 { font-size:15px; color:#fde68a; margin:18px 0 10px; }
.detail-body p { margin-bottom:12px; }
.detail-body ul, .detail-body ol { margin:10px 0 14px 20px; }
.detail-body li { margin-bottom:6px; }
.detail-body blockquote { background:rgba(251,191,36,0.08); border-left:3px solid #fbbf24; padding:10px 14px; margin:14px 0; border-radius:0 8px 8px 0; }
.detail-body table { width:100%; border-collapse:collapse; margin:14px 0; font-size:13px; }
.detail-body th, .detail-body td { border:1px solid rgba(255,255,255,0.1); padding:8px 10px; text-align:left; }
.detail-body th { background:rgba(251,191,36,0.1); color:#fbbf24; }
.detail-body a { color:#60a5fa; text-decoration:none; }
.detail-body code { background:rgba(255,255,255,0.08); padding:2px 6px; border-radius:4px; font-size:13px; }
.detail-meta { font-size:11px; color:rgba(255,255,255,0.4); margin-bottom:16px; padding-bottom:12px; border-bottom:1px solid rgba(255,255,255,0.08); }
</style>
</head>
<body>

<div class="header">
  <h1>💡 我的洞察</h1>
  <div class="sync-info" id="syncInfo">同步中...</div>
  <a href="index.html" class="back-btn">← 返回工作台</a>
</div>

<div class="container">
  <div class="stats-bar">
    <div class="stat-card"><div class="num" id="totalCount">0</div><div class="label">总洞察</div></div>
    <div class="stat-card"><div class="num" id="highCount">0</div><div class="label">高关注</div></div>
    <div class="stat-card"><div class="num" id="mediumCount">0</div><div class="label">中关注</div></div>
    <div class="stat-card"><div class="num" id="lowCount">0</div><div class="label">低关注</div></div>
  </div>

  <div id="insightsList">
    <div class="loading">正在从 Obsidian 同步...</div>
  </div>
</div>

<!-- 详情面板 -->
<div class="detail-overlay" id="detailOverlay" onclick="closeDetail()"></div>
<div class="detail-panel" id="detailPanel">
  <div class="detail-header">
    <div class="detail-title" id="detailTitle">洞察详情</div>
    <button class="close-btn" onclick="closeDetail()">✕ 关闭</button>
  </div>
  <div class="detail-body" id="detailBody"></div>
</div>

<script src="data.js"></script>
<script src="docs.js"></script>
<script src="docs-myinsights.js"></script>
<script>
function getDocHtml(path) {
  // 先从 docs.js 找，再从分片找
  if (typeof OBSIDIAN_DOCS !== 'undefined' && OBSIDIAN_DOCS[path]) return OBSIDIAN_DOCS[path];
  if (typeof OBSIDIAN_DOCS_CHUNK !== 'undefined') {
    for (const chunkKey in OBSIDIAN_DOCS_CHUNK) {
      if (OBSIDIAN_DOCS_CHUNK[chunkKey] && OBSIDIAN_DOCS_CHUNK[chunkKey][path]) {
        return OBSIDIAN_DOCS_CHUNK[chunkKey][path];
      }
    }
  }
  return '';
}

function extractPriority(html) {
  if (!html) return 'medium';
  if (html.includes('高关注') || html.includes('🔴')) return 'high';
  if (html.includes('低关注') || html.includes('🟢')) return 'low';
  return 'medium';
}

function extractTags(html) {
  if (!html) return [];
  const tags = [];
  const tagRegex = /#([\u4e00-\u9fa5a-zA-Z0-9]+)/g;
  let match;
  while ((match = tagRegex.exec(html)) !== null) {
    tags.push(match[1]);
  }
  return [...new Set(tags)].slice(0, 6);
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return dateStr;
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function priorityLabel(p) {
  return {high:'🔴 高关注', medium:'🟡 中关注', low:'🟢 低关注'}[p] || p;
}

function loadInsights() {
  const list = document.getElementById('insightsList');
  
  if (typeof OBSIDIAN_DATA === 'undefined') {
    list.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><div class="text">数据加载失败，请刷新页面</div></div>';
    return;
  }

  // 从 nodes 筛选我的洞察
  const myInsights = (OBSIDIAN_DATA.nodes || []).filter(n => n.topic === 'myinsights');
  
  // 按更新时间排序
  myInsights.sort((a, b) => new Date(b.updated) - new Date(a.updated));

  // 统计
  let high = 0, medium = 0, low = 0;
  const insightsWithMeta = myInsights.map(node => {
    const docHtml = getDocHtml(node.path);
    const priority = extractPriority(docHtml);
    const tags = extractTags(docHtml);
    if (priority === 'high') high++;
    else if (priority === 'low') low++;
    else medium++;
    return { ...node, priority, tags, docHtml };
  });

  document.getElementById('totalCount').textContent = myInsights.length;
  document.getElementById('highCount').textContent = high;
  document.getElementById('mediumCount').textContent = medium;
  document.getElementById('lowCount').textContent = low;
  document.getElementById('syncInfo').textContent = `已同步 ${OBSIDIAN_DATA.generatedTime || ''}`;

  if (myInsights.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="icon">💡</div><div class="text">还没有洞察，在 Obsidian 的「我的洞察」目录里创建笔记即可同步</div></div>';
    return;
  }

  list.innerHTML = insightsWithMeta.map(item => `
    <div class="insight-card" onclick="openInsight('${item.path.replace(/'/g, "\\'")}', '${item.title.replace(/'/g, "\\'")}')">
      <div class="card-header">
        <div class="title">${item.title}</div>
        <span class="priority priority-${item.priority}">${priorityLabel(item.priority)}</span>
      </div>
      <div class="content">${item.desc || '点击查看完整内容'}</div>
      ${item.tags.length ? `<div class="tags">${item.tags.map(t => `<span class="tag">#${t}</span>`).join('')}</div>` : ''}
      <div class="card-footer">
        <span class="date">更新于 ${formatDate(item.updated)}</span>
        <span class="word-count">${item.wordCount || 0} 字</span>
      </div>
    </div>
  `).join('');
}

function openInsight(path, title) {
  const html = getDocHtml(path);
  document.getElementById('detailTitle').textContent = title || '洞察详情';
  document.getElementById('detailBody').innerHTML = html || '<p>内容加载失败</p>';
  document.getElementById('detailOverlay').classList.add('active');
  document.getElementById('detailPanel').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeDetail() {
  document.getElementById('detailOverlay').classList.remove('active');
  document.getElementById('detailPanel').classList.remove('active');
  document.body.style.overflow = '';
}

// 初始化
loadInsights();
</script>
</body>
</html>
