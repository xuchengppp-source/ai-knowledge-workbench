opic作为FDE模式的最早定义者和最大实践者，其一手团队结构、定价模型、交付SLA、项目验收标准在中国知识库完全空白。T3/零一万物案例是本土二手观察，缺少与原产地最佳实践的对标。", "severity": "critical", "impact": "无法回答FDE业务的合理利润率区间、单FDE年产能上限、客户合同标准条款；本土FDE定价无锚", "suggestion": "建立'OpenAI Forward Deployed Engineering / Anthropic Mission Alignment'一手研究档案，拆解其团队规模（传闻各50-200人）、定价模型（推测$500K-$5M/年单客户）、合同结构、案例公开材料"}, {"domain": "企业AI与智能体商业化", "type": "领域覆盖不足", "description": "FDE交付方法论有五阶段框架，但完全没有FDE服务的商业定价/收费模式：按人天？按项目？按Token消耗分成？按业务结果抽成？按座位订阅？五种模式的财务模型对比和适用场景未建立。", "severity": "critical", "impact": "FDE业务无法报价、无法规模化、无法向投资人和政府解释商业模式", "suggestion": "建立FDE五维定价模型（人天/项目/Token分成/结果分成/订阅），用甘食记/己未文化/蜀道金租三个已知案例反推单价区间，输出行业可参考的报价区间表"}, {"domain": "AI Agent工程知识", "type": "领域覆盖不足", "description": "观测治理层有概念，但生产级AI Agent的安全威胁建模完全缺失：提示词注入、工具滥用、记忆投毒、权限越权、供应链投毒（恶意MCP插件）、侧信道泄漏等攻击路径没有系统梳理，防御手段为零。Agent with Harness意味着更大攻击面。", "severity": "critical", "impact": "任何ToB/政府场景的Agent部署都会卡在安全审查环节，已知电网数字化腐败案例警示够强", "suggestion": "建立Agent Threat Model 1.0：参照OWASP LLM Top 10+MITRE ATLAS，输出AI Agent专属威胁清单，配套防御工具链（如NeMo Guardrails/Lakera/微软PyRIT）和FDE安全交付SOP"}, {"domain": "多智能体协作体系", "type": "有案例无提炼", "description": "本地多Agent协作Memory Guard方案已落地，但2026年业界前沿趋势是'自演化集体记忆'和'脑启发记忆模型'（brain-inspired memory models，含情景记忆/语义记忆/程序性记忆分层、记忆巩固与遗忘机制），知识库对这类前沿架构只字未提。腾讯云Agent Memory方案横评夺冠代表云端方向，但本地如何演进到自演化还没有路线图。", "severity": "high", "impact": "本地多Agent方案会在6-12个月内被云端自演化记忆产品降维打击；个人级知识库治理失去技术领先性", "suggestion": "跟踪2026 AI Memory综述、Mem0/MemGPT/Letta等开源项目，建立'Memory Evolution路线图'：从当前Memory Guard静态命令集演进到基于向量+图谱+衰减权重的自演化记忆；设计Obsidian+Mem0双轨架构验证"}, {"domain": "多智能体协作体系", "type": "领域覆盖不足", "description": "多智能体协作的内部机制有（Memory Guard/状态机/Handoff），但跨Agent通信协议标准化（MCP/Anthropic、Google A2A Protocol、AGNTCY/Linux Foundation等）完全没有覆盖。Agent间如何发现对方、如何鉴权、如何交换任务、如何协商结果，是多Agent走向生产必须解决的基础设施问题。", "severity": "high", "impact": "多Agent系统仍是孤岛，无法与企业内外部其他Agent生态互联互通；FDE交付会被锁定到单供应商", "suggestion": "建立'Agent Interop Standards跟踪档案'，重点跟踪MCP（已事实标准）、A2A（Google 2025推出）、ANP、IBM ACP四个协议；在MC-001项目中验证MCP+A2A双协议接入"}, {"domain": "企业AI与智能体商业化", "type": "深度不足", "description": "AI Agent ToB的ROI论述有，但量化度量体系缺失：什么KPI算'业务增长'？是GMV提升？人力替代率？决策提速？归因模型怎么算（去除季节性/外部变量后Agent贡献的增量）？回收期多长算合格？没有行业基线。", "severity": "high", "impact": "FDE提案无法回答甲方'凭什么值得这个价'的硬问题；工信部414号文AI应用服务商申报缺乏量化抓手", "suggestion": "建立AI Agent ROI度量框架V1：分行业基线指标（餐饮：等位时长-15%/翻台率+10%；金租：审批时效-50%/风控准确率+3pp），归因模型使用差分中差分（DiD）或合成控制法"}, {"domain": "AI Agent工程知识", "type": "领域覆盖不足", "description": "现有工程架构全是云端/服务器侧Agent，端侧Agent（手机Agent/IoT Agent/嵌入式Agent）架构完全空白。随着Apple Intelligence/小米/华为端侧大模型铺开，端云协同Agent是2026年最重要的部署形态之一，知识库完全没有覆盖。", "severity": "high", "impact": "错过端侧Agent蓝海；个人级多Agent方案与未来手机/车机Agent生态脱节", "suggestion": "建立端侧Agent架构专题：研究Apple Intelligence/小米MiMo/高通骁龙AI Hub的Agent运行时；定义端云协同的Memory/工具/Handoff拆分边界；将Cordis运行时改造为端云双模版本"}, {"domain": "AI产业链与数字基础设施", "type": "空白交叉", "description": "汕头Token出海有案例，但AI Agent和数据/Token跨境合规框架空白：什么Token可以出境？什么不行？网信办数据出境安全评估办法/标准合同办法/认证办法三条路径如何选择？FDE做海外业务如何合规？完全没有整理。", "severity": "high", "impact": "AI出海业务面临政策性停摆风险；工信部414号文AI应用服务商出海路径不清晰", "suggestion": "建立'AIToken跨境合规手册'：拆解数据出境三条路径适用场景、典型Agent数据类型分级（模型权重/训练数据/对话日志/记忆库）、欧盟AI Act+GDPR叠加要求、东南亚/中东合规快线"}, {"domain": "AI Agent工程知识", "type": "有定义无案例", "description": "生产级Agent有八类生产能力+五大管控域定义，但每个能力的真实生产案例和反例都没有：长程任务（小时/天级）实际跑通过哪些？工具组合调用真实成功率？记忆系统在不同业务场景的命中率差异？没有真实案例支撑的定义是空中楼阁。", "severity": "medium", "impact": "FDE培训和企业选型没有可对照的真实基准，全靠供应商自吹", "suggestion": "建立'Agent生产案例库V1'：用Alpha Friday真实项目数据回填八类能力的成功率/失败率/成本分布；建立失败案例复盘档案（AI Office早期失败模式归类）"}, {"domain": "生物医疗与生物医药", "type": "过时风险", "description": "Moderna-Merck STING激动剂佐剂III期突破（2026-08-19）已记录，但后续商业化路径（定价/医保谈判/适应症扩展/竞品如Gritstone Bio/Arcturus跟进）尚未跟踪。AI制药（赜灵生物）只有公司层面案例，缺乏与海外AI制药公司（Insilico/Recursion/Exscientia）的能力/管线/估值横评。", "severity": "medium", "impact": "cGAS-STING从学术突破到产业兑现的关键转折点可能错失；AI制药价值链定位缺乏全球对标", "suggestion": "建立'STING赛道产业追踪档案'：跟踪Moderna mRNA-1083商业化进度、辉瑞/BMS在STING的跟进管线、AI制药公司管线数量与临床转化率横评、GPAS平台与之的合作接口"}, {"domain": "企业AI与智能体商业化", "type": "领域覆盖不足", "description": "FDE方法论覆盖五个阶段，但'持续运营'阶段如何建立Agent与甲方团队的长期协同治理机制空白：版本升级时谁决策？模型迭代谁来评估？Agent出错的责任划分？知识资产归属？这些运营治理问题决定了Agent能否在企业活过12个月。", "severity": "medium", "impact": "大量Agent项目死在3-6个月的'运营真空期'，FDE交付完即烂尾", "suggestion": "建立'Agent运营治理框架'：参照SaaS客户成功（CSM）模式，设计FDE交付后的季度业务评审（QBR）、版本治理委员会（甲方+乙方+模型方三方）、知识资产归属与交接SOP、SLA违约处置流程"}]}, "insights": {"insights": [{"title": "FDE、Harness、Token工厂中间层是同一件事的三张面孔", "insight": "FDE不是凭空冒出来的新职业，它和Harness工程化、Token工厂价值迁移根本就是同一现象的三个观察角度。基础模型能力趋同之后，比拼的就是谁能把模型变成可托付的产品——FDE是这个做事的人，Harness是这个人用的工具套件，Token工厂的L3/L4层（占总价值75-85%）是他站的位置。三者缺一不可，单独看任何一面都看不清全貌。", "why_important": "这是把分散在三个领域里的概念第一次打通。理解了这层关系，就不会把FDE当单纯的技术外包，也不会把Harness当单纯的工程框架，更不会把Token工厂当单纯的卖算力生意——而是看到一条完整的价值链。", "action": "把FDE团队建设、Harness工程能力建设、Token服务层产品设计绑成一个战略议题统一规划；用Harness六层架构作为FDE交付SOP的工程底座，用商业利用率/MFU指标考核FDE的真实Token产出而非交付工时。", "evidence": "FDE五阶段方法论↔Harness六层架构的方法论迁移关系；易观分析'Token工厂五层价值链，L1+L3+L4占75-85%'；2026年业界共识'模型是马，Harness是缰绳'。"}, {"title": "算力金融化的锚点必须从裸算力切换到Harness工程能力", "insight": "吉姆查诺斯说AI是泡沫，是因为他还在用裸算力规模和资本开支来衡量AI公司价值。但2026年的真相是：决定AI项目能不能跑出商业价值的关键变量，已经从'你有多少张GPU'变成了'你的Harness做得多好'。如果Token贷、算力贷的风控模型不把Harness成熟度加进去作为授信变量，未来一定会重演'数据中心建得越多死得越多'的局面。", "why_important": "这是一个估值范式的根本切换。当前算力金融化产品（Token贷/算力贷/算力券）的授信逻辑普遍还停留在'资产规模=价值'的传统金融思维，完全没有捕捉到Harness工程能力这个新变量。", "action": "建立Harness Quality Score（HQS）作为算力金融化产品的核心授信指标；在AI应用服务商评级体系中把Harness工程成熟度作为一票否决项；用商业利用率+Harness质量双指标替代纯算力规模估值。", "evidence": "腾讯云'Harness是2026年AI工程核心范式，Harness设计质量是AI产品分水岭'；算力金融化趋势（Token贷/算力贷/算力券）；吉姆查诺斯AI投资泡沫论的逻辑漏洞；知识缺口里HQS评估体系完全空白。"}, {"title": "工信部414号文是FDE爆发的政策发动机", "insight": "政策要培育AI应用服务商→市场需要把模型变成可用产品的角色→FDE应运而生。这是一条典型的政策到市场的传导链条。FDE不只是技术执行角色，更是国资、补贴、算力券这些政策资金与真实业务场景之间的'翻译器'。没有FDE这一层，414号文下发的政策资金很容易空转成无人使用的算力采购。", "why_important": "理解了这层因果，就抓住了政策窗口期的红利分配机制——谁能率先把FDE能力建设起来，谁就能在政策落地过程中拿到最大份额；谁把FDE当成普通技术外包，谁就错过了政策与市场的接口红利。", "action": "在政府AI应用服务商申报材料中明确把FDE交付能力作为核心竞争力指标；建立FDE案例库证明政策资金的真实转化率；用FDE团队规模+交付案例数作为申请算力券/补贴的硬通货。", "evidence": "工信部414号文'AI应用服务商培育'政策原文；FDE从早期T3/零一万物向教育、文旅、农业等更多领域延伸的趋势；FDE作为政策-市场中间层的因果链条分析。"}, {"title": "本地多Agent系统的天花板正在撞上Token工厂的服务边界", "insight": "当前Memory Guard+Obsidian这套本地多Agent方案在小时级任务上运转良好，但2026年AI Memory的前沿已经在向'自演化集体记忆'和'脑启发记忆模型'演进（情景记忆/语义记忆/程序性记忆分层+记忆巩固与遗忘机制）。更关键的是，'持续运行数天'的Agent本质上就是持续的Token消耗过程，本地架构迟早要面对算力天花板和并发上限。本地多Agent系统与云端Token服务之间的标准接口层，是下一个被低估的产品级机会。", "why_important": "这是用未来6-12个月的视角看本地架构的局限性。如果不在现在设计'Multi-Agent Token Adapter'这样的标准接口，未来会被云端自演化记忆产品（如腾讯云Agent Memory方案）降维打击，本地架构变成孤岛。", "action": "设计'Multi-Agent Token Adapter'作为本地协作系统与云端Token服务的标准接口；在MC-001项目中增加'长时任务Token预算'模块；跟踪Mem0/MemGPT/Letta等开源项目演进；建立Obsidian+Mem0双轨架构做小规模验证。", "evidence": "2026 AI Memory综述指出多智能体记忆共享理论框架尚未成熟；腾讯云Agent Memory方案横评夺冠代表云端方向；'持续运行数小时甚至数天'成为新需求形态；多Agent体系与AI产业链的'空白交叉'知识缺口。"}, {"title": "决策传导七层链条可以直接平移到AI合规治理", "insight": "做法律政策研究时用的'决策传导七层链条'方法论（定层级→辨形态→看关联→判影响），完全可以一字不改地用到AI合规治理上。FDE在企业落地AI时碰到的合规问题，本质上就是预判AI监管政策从中央到地方、从法律到政策的传导路径。这套方法论FDE如果掌握了，合规就变成竞争壁垒；不掌握，就会在类似电网数字化腐败那样的坑里翻车。", "why_important": "这是把一个看似不相关的领域（法律政策研究）的方法论直接迁移到AI ToB交付的核心环节。FDE培训市场上几乎没人讲这个，但实战中它的价值可能比任何技术能力都大。", "action": "在FDE五阶段方法论中加入'政策预判'作为第0步；建立AI监管政策的四步预判卡片作为FDE标配工具；把'决策传导框架'列为FDE培训的核心模块，权重不低于技术能力。", "evidence": "决策传导七层链条方法论；AI数字化招标与合规治理框架（立项-招采-供应商锁定-验收留痕-上线评估）；电网数字化腐败重灾区案例反向印证合规盲区的代价。"}, {"title": "Agent安全威胁建模是ToB Agent部署的最大盲区", "insight": "Agent从聊天机器人进化到'拥有工具调用+长期记忆+权限边界'的执行体之后，攻击面是指数级扩大的——提示词注入、工具滥用、记忆投毒、权限越权、供应链投毒（恶意MCP插件）、侧信道泄漏，每一条都是真实威胁。但当前生产级Agent的八类生产能力定义和五大管控域里，对安全威胁建模几乎是空白。这意味着任何ToB或政府场景的Agent部署到了安全审查环节都会卡壳。", "why_important": "电网数字化腐败案例已经警示过，没有安全治理的数字化项目必然出事。Agent的安全风险比传统IT系统高一个数量级——它能调用工具、能记住你的对话、能代表你做决策。一旦出事，影响的不是数据，是业务行为本身。", "action": "建立Agent Threat Model 1.0：参照OWASP LLM Top 10和MITRE ATLAS，输出AI Agent专属威胁清单；引入NeMo Guardrails/Lakera/微软PyRIT等开源防御工具；把安全威胁建模作为FDE交付SOP的强制环节。", "evidence": "六层架构每一层都是攻击面（入口/编排/模型/工具/记忆/观测治理）；电网数字化腐败重灾区案例；'生产级AI Agent的安全威胁建模完全缺失'被列为critical级知识缺口。"}, {"title": "FDE最被低估的核心竞争力是'政治成熟度'", "insight": "技术能力只是FDE的入场券，真正的胜负手是能不能在一号位（企业最高决策者）面前站住——能不能听懂弦外之音、能不能识别组织里的真实阻力、能不能在多方博弈中守住项目边界。己未文化咨询、零一万物一号位工程的案例反复证明一件事：FDE跑得通，靠的不是技术多牛，是人的政治成熟度。这跟个人承载力方法论里的'高阶政治成熟'其实是同一回事，只是尺度不同——FDE面对的是企业一号位，个人面对的是复杂人际环境，底层都是'在混沌中保持定力+识人用人+边界判断'。", "why_important": "这颠覆了FDE人才选拔的常见标准——当前大家还在卷技术能力和案例数量，但实际上决定FDE能走多远的是政治成熟度。这个维度不培养，团队的天花板会很低。", "action": "把FDE人才选拔标准从'技术能力+业务理解'升级为'技术+业务+政治成熟度'三维评估；用承载力方法论（高阶政治成熟+三个心法+边界）作为FDE培训的核心模块；在FDE晋升通道中把政治成熟度作为高级别门槛。", "evidence": "己未文化咨询公司FDE落地案例的关键成败因素；零一万物一号位工程对FDE政治判断力的要求；承载力四层能力与三个心法方法论；个人能力提升与FDE的'概念同构'关系。"}]}, "verification": {"insights_verification": [{"index": 0, "confidence": "medium", "verified": false, "issue": "洞察正文写'L3/L4层（占总价值75-85%）'，但所引证据是'L1+L3+L4占75-85%'，两者不一致——L3/L4两层并不等于L1+L3+L4三层之和。如果原文是把L3+L4等同于75-85%，则证据引用错了；如果75-85%确实包含L1，则正文描述遗漏了L1。这是关键数据矛盾，会直接影响读者对价值分布的判断。", "suggestion": "明确说明75-85%的口径是L3+L4还是L1+L3+L4，并修正证据引用或正文描述中对应的一方。"}, {"index": 1, "confidence": "medium", "verified": true, "issue": "'裸算力'术语偏圈内化，对一般读者不够友好；另外将Harness成熟度直接作为金融授信变量属于较大胆的范式断言，目前缺乏实证数据支撑（HQS体系本身还在gap阶段）。", "suggestion": "'裸算力'可改为'纯算力规模'或'GPU数量'增加可读性；在action中注明HQS作为授信变量目前是'前瞻性建议'而非'已验证做法'，避免过度承诺。"}, {"index": 2, "confidence": "high", "verified": true, "issue": "", "suggestion": "因果链条'政策→市场需要→FDE应运而生'逻辑清晰，'翻译器'比喻贴切。可在evidence中补充FDE承接政策资金的真实案例（如某地算力券使用率数据），进一步增强说服力。"}, {"index": 3, "confidence": "medium", "verified": true, "issue": "'降维打击'一词略有营销色彩；'迟早要面对算力天花板'在本地方案实际负载尚未充分测试的情况下属于推断性结论。", "suggestion": "'降维打击'可改为'形成代差'或'被替代'；将'迟早要面对'改为'在持续运行数天的负载下将不可避免地遇到'，并补一个具体场景（如某任务实测Token消耗曲线）。"}, {"index": 4, "confidence": "medium", "verified": true, "issue": "'一字不改地用到'过于绝对，任何方法论迁移都需要适配调整，AI合规治理场景与法律政策研究在主体、时效性、博弈结构上存在差异。", "suggestion": "改为'经过必要适配后可以直接迁移'或'核心四步可直接复用'，承认迁移过程中的微调需要。"}, {"index": 5, "confidence": "high", "verified": true, "issue": "'攻击面是指数级扩大'用词略夸张，从有限模块增加攻击面更接近'阶跃式'而非'指数级'；但列出的六类威胁均真实，OWASP LLM Top 10和MITRE ATLAS引用准确。", "suggestion": "'指数级'改为'数量级跃升'或'显著扩大'，与实际安全研究语境一致。"}, {"index": 6, "confidence": "medium", "verified": true, "issue": "将'政治成熟度'定位为'最被低估的核心竞争力'属于价值判断而非事实判断，需要更明确的方法论依据；个人承载力方法论与FDE的'概念同构'是合理类比，但'底层都是……'的表述略简化。", "suggestion": "在evidence中补充至少一个FDE项目因政治判断失误导致失败的具名案例（脱敏后），将'最被低估'改为'被严重低估'或'长期被低估'降低绝对化程度。"}], "gaps_verification": [{"index": 0, "confidence": "high", "verified": true, "issue let currentResult = null;
let chart = null;

function init() {
  // 模型选择器
  const selector = document.getElementById('modelSelector');
  PAGE_DATA.results.forEach((r, i) => {
    const btn = document.createElement('button');
    btn.className = 'model-btn' + (i === 0 ? ' active' : '');
    btn.textContent = r.model_name;
    btn.onclick = () => switchModel(i);
    selector.appendChild(btn);
  });

  // 历史版本
  const histSelect = document.getElementById('historySelect');
  PAGE_DATA.history_files.forEach(f => {
    const opt = document.createElement('option');
    opt.value = f;
    opt.textContent = f.replace('.json', '');
    histSelect.appendChild(opt);
  });

  if (PAGE_DATA.results.length > 0) {
    switchModel(0);
  }
}

function switchModel(index) {
  document.querySelectorAll('.model-btn').forEach((b, i) => b.classList.toggle('active', i === index));
  currentResult = PAGE_DATA.results[index];
  renderAll();
}

function renderAll() {
  renderInsights();
  renderGaps();
  renderGraph();
  renderStats();
}

function renderInsights() {
  const body = document.getElementById('insightsBody');
  const insights = currentResult.insights.insights || [];
  const verification = currentResult.verification?.insights_verification || [];
  document.getElementById('insightCount').textContent = insights.length;
  body.innerHTML = '';
  insights.forEach((ins, i) => {
    const v = verification[i] || {};
    const conf = v.confidence || 'medium';
    const card = document.createElement('div');
    card.className = 'insight-card';
    card.innerHTML = `<div class="title">${i+1}. ${ins.title}</div>
      <div class="desc">${ins.insight}</div>
      <span class="confidence confidence-${conf}">${conf} 置信度</span>`;
    card.onclick = () => showDetail('insight', ins, v);
    body.appendChild(card);
  });
}

function renderGaps() {
  const body = document.getElementById('gapsBody');
  const gaps = currentResult.gaps.gaps || [];
  const verification = currentResult.verification?.gaps_verification || [];
  document.getElementById('gapCount').textContent = gaps.length;
  body.innerHTML = '';
  gaps.forEach((gap, i) => {
    const v = verification[i] || {};
    const item = document.createElement('div');
    item.className = 'gap-item';
    item.innerHTML = `<span class="gap-severity severity-${gap.severity}">${gap.severity}</span>
      <div class="desc"><b>${gap.domain}</b> · ${gap.description}</div>
      <div class="suggestion">→ ${gap.suggestion}</div>`;
    item.onclick = () => showDetail('gap', gap, v);
    body.appendChild(item);
  });
}

function renderGraph() {
  if (!chart) chart = echarts.init(document.getElementById('graph'));
  const domains = currentResult.domains.domains || [];
  const relations = currentResult.relations.relations || [];
  const color = currentResult.model_color || '#00d4ff';

  const nodes = [{id:'kb', name:'徐总知识库', category:0, symbolSize:50, value:'Obsidian 知识库'}];
  const domainNames = new Set();
  domains.forEach(d => {
    if (d.name && !domainNames.has(d.name)) {
      domainNames.add(d.name);
      nodes.push({id:d.name, name:d.name, category:1, symbolSize:36,
        value:(d.core_question||'') + ' | ' + (d.key_concepts||[]).join(', ')});
    }
  });

  const links = [];
  relations.forEach(r => {
    if (domainNames.has(r.source) && domainNames.has(r.target)) {
      const w = r.importance === 'high' ? 3 : (r.importance === 'medium' ? 2 : 1);
      links.push({source:r.source, target:r.target, value:r.insight, type:r.type, lineStyle:{width:w}});
    }
  });
  domainNames.forEach(n => links.push({source:'kb', target:n, value:'核心领域', lineStyle:{width:1, opacity:0.3}}));

  chart.setOption({
    backgroundColor:'transparent',
    tooltip:{trigger:'item', backgroundColor:'rgba(10,10,26,0.95)', borderColor:color+'44',
      textStyle:{color:'#fff', fontSize:12},
      formatter:p => p.dataType==='node' ? '<b>'+p.data.name+'</b><br>'+(p.data.value||'') :
        '<b>'+p.data.source+' ↔ '+p.data.target+'</b><br>'+(p.data.value||'')},
    series:[{type:'graph', layout:'force', data:nodes, links:links,
      categories:[{name:'总览'},{name:'领域'}], roam:true, draggable:true, focusNodeAdjacency:true,
      force:{repulsion:600, edgeLength:[120,220], gravity:0.08},
      label:{show:true, position:'bottom', color:'#fff', fontSize:11, fontWeight:600,
        textBorderColor:'rgba(0,0,0,0.8)', textBorderWidth:2},
      lineStyle:{color:'source', curveness:0.2, opacity:0.5},
      emphasis:{focus:'adjacency', lineStyle:{width:4, opacity:0.9}},
      itemStyle:{borderColor:'#fff', borderWidth:1.5, shadowBlur:15, shadowColor:color+'44'},
      animationDuration:1500}],
    color:['#6bcb77', color]
  }, true);

  chart.off('click');
  chart.on('click', p => {
    if (p.dataType === 'edge') {
      const rel = relations.find(r => (r.source===p.data.source&&r.target===p.data.target)||(r.source===p.data.target&&r.target===p.data.source));
      if (rel) showDetail('relation', rel, {});
    }
  });
}

function renderStats() {
  const d = currentResult.domains.domains?.length || 0;
  const r = currentResult.relations.relations?.length || 0;
  const g = currentResult.gaps.gaps?.length || 0;
  const i = currentResult.insights.insights?.length || 0;
  document.getElementById('stats').innerHTML = `<span>${d}</span> 领域 · <span>${r}</span> 关系 · <span>${g}</span> 缺口 · <span>${i}</span> 洞察 · ${currentResult.model_name}`;
}

function showDetail(type, data, verification) {
  const panel = document.getElementById('detail-panel');
  const body = document.getElementById('detailBody');
  let html = '<div class="detail-content">';
  if (type === 'insight') {
    html += `<div class="dtype">💡 关键洞察</div>
      <div class="dinsight"><b>${data.title}</b><br><br>${data.insight}</div>
      <div class="devidence">📌 为什么重要：${data.why_important}</div>
      <div class="devidence">🔍 证据：${data.evidence}</div>
      <div class="daction">🎯 行动建议：${data.action}</div>`;
    if (verification.confidence) html += `<div style="margin-top:10px"><span class="confidence confidence-${verification.confidence}">${verification.confidence} 置信度</span></div>`;
  } else if (type === 'gap') {
    html += `<div class="dtype">⚠️ 知识缺口</div>
      <div class="dinsight"><b>${data.domain}</b> · ${data.description}</div>
      <div class="devidence">📌 影响：${data.impact}</div>
      <div class="daction">🎯 补全建议：${data.suggestion}</div>`;
  } else if (type === 'relation') {
    html += `<div class="dtype">🔗 ${data.type}</div>
      <div class="dinsight">${data.insight}</div>
      <div class="devidence">🔍 证据：${data.evidence}</div>
      <div class="daction">🎯 ${data.action}</div>`;
  }
  html += '</div>';
  body.innerHTML = html;
  panel.style.display = 'block';
}

def togglePanel(id) { document.getElementById(id).classList.toggle('collapsed'); }

async function loadHistory(file) {
  // 从 history/ 目录加载历史版本
  try {
    const resp = await fetch('history/' + file);
    if (!resp.ok) throw new Error('加载失败');
    const result = await resp.json();
    // 临时加入 results 并切换
    if (!PAGE_DATA.results.find(r => r.generated_at === result.generated_at)) {
      PAGE_DATA.results.push(result);
    }
    const idx = PAGE_DATA.results.findIndex(r => r.generated_at === result.generated_at);
    // 更新模型选择器
    const selector = document.getElementById('modelSelector');
    selector.innerHTML = '';
    PAGE_DATA.results.forEach((r, i) => {
      const btn = document.createElement('button');
      btn.className = 'model-btn' + (i === idx ? ' active' : '');
      btn.textContent = r.model_name + (r.generated_at ? ' (' + r.generated_at.slice(5,16) + ')' : '');
      btn.onclick = () => switchModel(i);
      selector.appendChild(btn);
    });
    switchModel(idx);
  } catch(e) {
    alert('历史版本加载失败: ' + e.message);
  }
}

window.addEventListener('resize', () => chart && chart.resize());
init();
</script>
