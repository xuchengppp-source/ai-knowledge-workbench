    const item = document.createElement('div');
    item.className = 'gap-item';
    item.innerHTML = `<span class="gap-severity severity-${gap.severity}">${gap.severity}</span>
      <div class="desc"><b>${gap.domain}</b> · ${gap.description}</div>
      <div class="suggestion">→ ${gap.suggestion}</div>`;
    item.onclick = () => showDetail('gap', gap, v);
    body.appendChild(item);
  });
}

function renderGraph() {
  if (!chart) chart = echarts.init(document.getElementById('graph'));
  const domains = currentResult.domains.domains || [];
  const relations = currentResult.relations.relations || [];
  const color = currentResult.model_color || '#00d4ff';

  const nodes = [{id:'kb', name:'徐总知识库', category:0, symbolSize:50, value:'Obsidian 知识库'}];
  const domainNames = new Set();
  domains.forEach(d => {
    if (d.name && !domainNames.has(d.name)) {
      domainNames.add(d.name);
      nodes.push({id:d.name, name:d.name, category:1, symbolSize:36,
        value:(d.core_question||'') + ' | ' + (d.key_concepts||[]).join(', ')});
    }
  });

  const links = [];
  relations.forEach(r => {
    if (domainNames.has(r.source) && domainNames.has(r.target)) {
      const w = r.importance === 'high' ? 3 : (r.importance === 'medium' ? 2 : 1);
      links.push({source:r.source, target:r.target, value:r.insight, type:r.type, lineStyle:{width:w}});
    }
  });
  domainNames.forEach(n => links.push({source:'kb', target:n, value:'核心领域', lineStyle:{width:1, opacity:0.3}}));

  chart.setOption({
    backgroundColor:'transparent',
    tooltip:{trigger:'item', backgroundColor:'rgba(10,10,26,0.95)', borderColor:color+'44',
      textStyle:{color:'#fff', fontSize:12},
      formatter:p => p.dataType==='node' ? '<b>'+p.data.name+'</b><br>'+(p.data.value||'') :
        '<b>'+p.data.source+' ↔ '+p.data.target+'</b><br>'+(p.data.value||'')},
    series:[{type:'graph', layout:'force', data:nodes, links:links,
      categories:[{name:'总览'},{name:'领域'}], roam:true, draggable:true, focusNodeAdjacency:true,
      force:{repulsion:600, edgeLength:[120,220], gravity:0.08},
      label:{show:true, position:'bottom', color:'#fff', fontSize:11, fontWeight:600,
        textBorderColor:'rgba(0,0,0,0.8)', textBorderWidth:2},
      lineStyle:{color:'source', curveness:0.2, opacity:0.5},
      emphasis:{focus:'adjacency', lineStyle:{width:4, opacity:0.9}},
      itemStyle:{borderColor:'#fff', borderWidth:1.5, shadowBlur:15, shadowColor:color+'44'},
      animationDuration:1500}],
    color:['#6bcb77', color]
  }, true);

  chart.off('click');
  chart.on('click', p => {
    if (p.dataType === 'edge') {
      const rel = relations.find(r => (r.source===p.data.source&&r.target===p.data.target)||(r.source===p.data.target&&r.target===p.data.source));
      if (rel) showDetail('relation', rel, {});
    }
  });
}

function renderStats() {
  const d = currentResult.domains.domains?.length || 0;
  const r = currentResult.relations.relations?.length || 0;
  const g = currentResult.gaps.gaps?.length || 0;
  const i = currentResult.insights.insights?.length || 0;
  document.getElementById('stats').innerHTML = `<span>${d}</span> 领域 · <span>${r}</span> 关系 · <span>${g}</span> 缺口 · <span>${i}</span> 洞察 · ${currentResult.model_name}`;
}

function showDetail(type, data, verification) {
  const panel = document.getElementById('detail-panel');
  const body = document.getElementById('detailBody');
  let html = '<div class="detail-content">';
  if (type === 'insight') {
    html += `<div class="dtype">💡 关键洞察</div>
      <div class="dinsight"><b>${data.title}</b><br><br>${data.insight}</div>
      <div class="devidence">📌 为什么重要：${data.why_important}</div>
      <div class="devidence">🔍 证据：${data.evidence}</div>
      <div class="daction">🎯 行动建议：${data.action}</div>`;
    if (verification.confidence) html += `<div style="margin-top:10px"><span class="confidence confidence-${verification.confidence}">${verification.confidence} 置信度</span></div>`;
  } else if (type === 'gap') {
    html += `<div class="dtype">⚠️ 知识缺口</div>
      <div class="dinsight"><b>${data.domain}</b> · ${data.description}</div>
      <div class="devidence">📌 影响：${data.impact}</div>
      <div class="daction">🎯 补全建议：${data.suggestion}</div>`;
  } else if (type === 'relation') {
    html += `<div class="dtype">🔗 ${data.type}</div>
      <div class="dinsight">${data.insight}</div>
      <div class="devidence">🔍 证据：${data.evidence}</div>
      <div class="daction">🎯 ${data.action}</div>`;
  }
  html += '</div>';
  body.innerHTML = html;
  panel.style.display = 'block';
}

function togglePanel(id) { document.getElementById(id).classList.toggle('collapsed'); }
function loadHistory(file) { /* 加载历史版本（需后端支持） */ console.log('加载历史:', file); }

window.addEventListener('resize', () => chart && chart.resize());
init();
</script>
</body>
</html>
