const relations = {"relations": [{"source": "AI产业链与基建", "target": "企业AI商业化", "type": "概念同构", "insight": "Token工厂的'有效算力与MFU运营缺口'与企业AI的'经营参谋vs经营系统'描述的是同一底层结构：名义能力与商业实际产出之间的鸿沟。硬件标称A100算力从上架到商业利用率可能跌至10-20%，正如Agent从'能对话'到'能管业务'的落差。两者都需要'有效产出'这一统一度量尺。", "evidence": "AI产业链的'有效算力与MFU（从硬件A 级到商业利用率的运营缺口）'；企业AI的'经营参谋 vs 经营系统'，前者只做信息呈现，后者形成管理闭环", "importance": "high", "action": "构建一套跨域的'有效产出指标体系'：基建侧用MFU+单Token成本商业率，商业化侧用决策命中率+闭环达成率。用同一套指标来同时衡量底层基建ROI和顶层Agent价值，避免产业链'建得起跑不起'和应用层'演示漂亮生产掉链'的双重失真。"}, {"source": "知识治理", "target": "生产级Agent工程", "type": "因果链条", "insight": "知识治理的成熟度直接决定Agent Memory层的有效上限。生产级Agent要求'全局Memory/会话Memory/业务事件Memory'三层分工，但如果没有'强制收口六步法'和一主多从结构做支撑，Agent的Memory层会退化为向量数据库里的噪声。知识治理→Memory质量→Agent可托付程度，是一条单向因果链。", "evidence": "知识治理的'Skill 与 Memory 分层（全局/会话/业务事件）'与'强制收口六步法'；生产级Agent的'生产级 RAG 与数据库知识库架构（事实库/文档知识库/状态机）'", "importance": "high", "action": "在生产级Agent的Memory架构设计中，将Obsidian的'一主多从唯一核心主版本'直接映射为Memory的写入规范：只有经过'收口'的知识才能进入全局Memory层，未消化的资料只在会话级停留。这是从'会聊'到'可托付'的工程必经之路。"}, {"source": "生产级Agent工程", "target": "低空经济", "type": "空白交叉", "insight": "低空经济当前的'大疆硬件+飞控+智巡平台'三层架构是纯IoT逻辑，没有Agent Runtime层。这意味着无人机巡检中90%的数据（实时图像、故障信号、路径异常）需要人工二判。生产级Agent的'六层架构（入口/编排/模型/工具/记忆/观测治理）'正好可以填补这个空白——把巡检数据流变成可托付的决策闭环。", "evidence": "低空的'蜀交低空/蜀道智巡三层架构（大疆硬件+凌次方飞控+蜀道智巡）'；生产级Agent的'确定性运行时（Workflow/状态机/MCP/质量门禁）'", "importance": "high", "action": "在蜀道智巡项目中试点'巡检Agent'：用Agent Runtime做实时故障分级、误报过滤、应急响应决策，把原本需要调度中心人员判断的工作下沉到Agent侧。这是把低空从'卖硬件+卖航线'升级为'卖运营服务'的关键拐点。"}, {"source": "法律", "target": "企业AI商业化", "type": "矛盾张力", "insight": "企业AI追求的是'经营系统级管理闭环'（Agent自动决策、自动执行、自动反馈），而法律体系要求的是'人类决策权保留'（行政处罚、行政诉讼、责任归属都要求自然人或法人为决策者）。两者的张力本质是：当Agent做出一个导致客户损失的决策时，责任是Agent的、客户自己的、还是FDE的？目前没有任何判例或规章覆盖这个真空。", "evidence": "企业AI的'业务对象化→关系→异常任务动作→反馈规则'闭环逻辑；法律的'行政诉讼法核心条款解读方向'与'七层决策链条'中要求决策主体可追溯", "importance": "high", "action": "在FDE合同模板里前置设计'Agent责任分层条款'：把决策权分为'信息呈现层（人负责）、建议层（人审核）、执行层（Agent负责但设止损规则）'。这套分层既呼应了法律对决策主体的要求，又保留了Agent的闭环价值，可作为行业标准模板。"}, {"source": "法律", "target": "个人知识", "type": "方法论迁移", "insight": "法律的'四步 空经济的'蜀交低空/蜀道智巡三层架构'与'招投标采购与生态平台化'", "importance": "medium", "action": "把AI产业链的'结果需求'商业模式（如AaaS按结果计费）迁移到低空经济：无人机巡检按'每公里巡检成本下降比例'计费，而不是按硬件销售或航线审批。这是把低空从'政策驱动'转向'价值驱动'的关键商业化升级。"}, {"source": "生物医疗", "target": "生产级Agent工程", "type": "空白交叉", "insight": "生物医疗的'创新药 vs 科研医药消费品'二分与生产级Agent的'信息层Agent vs 执行层Agent'二分在结构上同构。创新药要求执行层（真正临床有效），科研消费品停留在信息层（卖论文、卖概念、卖认知）。同理，Agent行业里也存在'信息层Agent（演示惊艳、生产掉链）'和'执行层Agent（业务闭环、可托付）'的真假之分。两个领域的真伪判断标准可相互参照。", "evidence": "生物医疗的'创新药 vs 科研医药消费品'与'八项创新药与科研消费品的核心差异'；生产级Agent的'信息层 Agent vs 执行层 Agent'与'业务分界（数据呈现 vs 管理闭环）'", "importance": "medium", "action": "建立'创新药×生产级Agent'对照表：左列是创新药的核心特征（机制清晰/临床有效/可量产/有差异化/有商业回报），右列是Agent的对照标准（业务对象化/管理闭环/可工程化/差异化价值/可计费）。用这个表同时过滤生物医疗项目和Agent项目，提升投资和业务判断效率。"}]};
const gaps = {"gaps": [{"domain": "法律 × 企业AI商业化", "type": "交叉空白", "description": "Agent自动决策导致客户损失时的责任归属真空完全空白。关系中已识别'信息呈现层/建议层/执行层'的三层责任分层思路，但知识库中既无FDE合同模板的责任分层条款样例，也无任何判例梳理，更无Agent决策可追溯性的技术-法律对照标准。", "severity": "critical", "impact": "FDE交付的每个Agent项目都面临客户法务质疑：Agent自动调价导致客户亏损、Agent自动审批导致合规事故、Agent自动关单导致上下游纠纷——这些场景一旦发生，无任何前置条款可援引，将直接导致项目无法签约或巨额赔付。", "suggestion": "1) 系统梳理国内外已发生的Agent决策纠纷判例（即使暂无，也要标注司法立场预判）；2) 设计'Agent责任分层合同模板V1'，把决策权按信息呈现/建议/执行三层分配止损规则与责任主体；3) 建立'Agent决策可追溯性技术标准'——记录每次决策的输入、依据、置信度、人审节点，作为法律证据链；4) 跟踪欧盟AI Act、美国AI Executive Order、国内生成式AI管理办法对Agent决策责任的具体要求。"}, {"domain": "低空经济 × 生产级Agent工程", "type": "交叉空白", "description": "关系已明确指出'低空经济当前三层架构是纯IoT逻辑，没有Agent Runtime层，90%巡检数据需人工二判'，但两个领域各自都没有'巡检Agent'的哪怕原型级方案。无飞行数据→故障分级Agent、误报过滤Agent、应急响应Agent的设计文档。", "severity": "critical", "impact": "蜀道智巡项目仍停留在'卖硬件+卖航线'阶段，无法升级为'卖运营服务'。而运营服务的核心正是Agent化的实时决策能力，缺失这一块意味着低空业务的ROI天花板被锁死在硬件销售毛利上，无法承接行业从'政策驱动'向'价值驱动'的转型。", "suggestion": "1) 在六层架构基础上设计'巡检Agent'专用runtime：输入是图像流+传感器流，输出是故障分级+处置建议+置信度；2) 用甘食记MCP流程控制器作为参照，设计'图像识别→异常判定→工单生成→人工复核→闭环归档'的Workflow；3) 以蜀道智巡现有航线作为试点场景，跑通3-5个真实故障案例的Agent化处理；4) 把Agent化后的'每公里巡检成本下降比例'作为新的计费指标，验证AaaS模式在低空的可行性。"}, {"domain": "数据要素与数据资产化", "type": "领域覆盖不足", "description": "Token工厂提到数据加工动作，数据在企业AI中作为生产要素反复出现，但'数据资产化、数据交易、数据确权、数据空间'这一整条价值链在知识库中完全没有独立覆盖。甘食记的经营数据、蜀道的巡检数据、刘教授的临床数据都属于'沉睡资产'，但如何估值、流通、合规交易无任何方法论。", "severity": "high", "impact": "企业AI商业化的客单价天花板被锁死在'交付实施费'上，无法延伸到'数据增值服务费'。Token工厂的L1-L5价值链中数据层也是关键一环，缺乏数据资产化方法论导致基建投资无法形成完整ROI闭环。", "suggestion": "新增'数据要素与数据资产化'领域：1) 梳理国家数据局数据二十条、数据资产入表会计准则的最新口径；2) 设计'企业数据资产评估四步法'（确权→估值→登记→流通）；3) 沉淀甘食记经营数据、蜀道巡检数据的资产化试点案例；4) 与AI产业链的Token工厂价值链打通，建立'数据→Token→资产'的转化路径。"}, {"domain": "AI原生组织设计", "type": "领域覆盖不足", "description": "关系中提到YC开源QM（多人在线Agent Harness）对AI原生组织的启示，但知识库中既无AI原生组织的组织架构范式，也无岗位重构（人+Agent协作的角色定义）、汇报关系、考核机制、招聘标准等具体内容。FDE团队本身就是准AI原生组织，但内部运转规则未被提炼。", "severity": "high", "impact": "蜀道集团、甘食记、己未文化等客户在引入FDE和Agent后，组织如何配套调整（哪些岗位被替代、哪些新设、如何考核）完全空白。FDE交付的是技术，但客户买的是组织能力升级——这块空白会直接降低项目续约率和扩张率。", "suggestion": "新增'AI原生组织设计'领域：1) 提炼FDE团队自身的AI原生协作模式作为最小可行样本；2) 跟踪YC QM、Salesforce Agentforce、Microsoft Copilot Organization等已发布的AI原生组织白皮书；3) 设计'AI原生组织成熟度五级模型'（工具替代→流程重构→角色重定义→决策权再分配→组织形态变革）；4) 以蜀道集团为案例，做一次'AI原生化组织诊断'。"}, {"domain": "信息层Agent vs 执行层Agent", "type": "有定义无案例", "description": "这个二分法是生产级Agent工程领域的核心判断标准，但知识库中无任何一个案例明确标注'这是信息层Agent'或'这是执行层Agent'。WorkBuddy、Codex、阿里QoderWork等被提及，但都没有按这个二分法做解剖式分析。生物医疗×Agent的关系中虽然有对照思路，但具体案例对照表未建立。", "severity": "high", "impact": "无法快速判断新接触的Agent产品/项目是真闭环还是假闭环，会导致两类失误：误把演示型Agent当生产级Agent采购、误把执行层Agent当聊天玩具卖低价。投资判断和客户教育都会失准。", "suggestion": "1) 建立'Agent真假十题清单'：有无状态机？有没有管理闭环？有没有质量门禁？有没有止损规则？等10个判断题；2) 对知识库中所有Agent案例（甘食记、WorkBuddy、QoderWork、Codex、零一万物万策等）逐一打标分类；3) 在生物医疗领域同步建立'创新药×执行层Agent'对照表，让两个领域的真伪标准互为佐证。"}, {"domain": "法律 × AI产业链与基建", "type": "有定义无案例 + 时效风险", "description": "Token出海合规、算力金融化合规、数据跨境合规被识别为高重要性空白，但法律领域中既无具体的Token分类案例（按数据类型/出海路径/资产形态三维分类），也无算力贷的现有监管文件梳理，更无'Token是商品还是服务还是证券'的法律定性分析。", "severity": "high", "impact": "Token工厂、算力金融化的商业模式正在狂奔，但合规边界完全空白。一旦监管出手（参考P2P、ICO的先例），所有未做合规预案的算力中心、Token工厂、算力贷产品将面临系统性风险。甘肃庆阳、福建厦门的Token工厂落地是首批合规试金石。", "suggestion": "1) 建立'Token出海合规地图'：按数据类型×出海路径×资产形态三维分类，逐格标注现行法律覆盖与监管真空；2) 跟踪商务部、海关总署、外汇管理局对Token的最新定性文件；3) 设计'算力贷合规自查清单'（参照网络小贷、ABS的监管框架）；4) 以福建厦门Token工厂为试点，跟踪其合规架构作为可复用模板。"}, {"domain": "蜀道集团三线变现棋局", "type": "有案例无提炼", "description": "蜀道金租内部资金通道、成渝120亿类REITs、iMA金融版图、企业AI、低空经济等案例丰富，但'金融资本运作+低空+企业AI三线变现'这套方法论只在关系中被提及，从未在政府资源或企业AI商业化领域中被独立提炼为可复用框架。", "severity": "high", "impact": "蜀道集团研究是个案级知识，无法迁移到其他国企/央企平台（如各省交投、地方产投集团）。每接触一个新的国资平台客户，都要重新摸索路径，效率极低，且无法形成可对外输出的方法论资产。", "suggestion": "1) 在政府资源领域新增'国资平台三线变现方法论'：横轴是金融/产业/科技三线，纵轴是资金通道/资产盘活/业务变现三层；2) 把蜀道集团作为基准案例做完整方法论拆解；3) 跟踪山东高速、江苏交控等同类国资平台，验证方法论的迁移性；4) 把方法论封装为FDE对国资客户的标准化提案模板。"}, {"domain": "个人知识 × 承载力", "type": "深度不足", "description": "'承载力与高阶政治成熟（四层能力+三个心法+边界）'被列为关键概念，但展开度极低，仅有'压力、人性、混沌中的定力'四个标签词。无任何具体的承载力培养路径、心法展开案例、边界设定的判断标准。与多智能体协作A000/MC-001/PA/DE/R的同构关系虽有，但'个人心智操作系统'的实操手册完全空白。", "severity": "high", "impact": "徐总本人同时驱动10个领域的研究与决策，承载力是真正的瓶颈。但承载力的提升目前停留在心法层面，无法工程化、可训练化、可观察化。多智能体协作的设计已经实现了工程化，承载力却仍停留在抽象概念，两者形成强烈反差。", "suggestion": "1) 把四层能力（压力、人性、混沌中的定力）逐一展开为可观察的行为指标；2) 设计'承载力日常训练SOP'：每日三省A000、每周复盘MC-001、每季校准方向；3) 沉淀徐总过去处理重大压力的真实案例（蜀道谈判、政策博弈等），做案例库；4) 把承载力与多智能体协作的四层架构做1:1映射，建立'个人Agent化心智模型'。"}, {"domain": "客户成功与商业运营", "type": "领域覆盖不足", "description": "FDE五阶段方法论覆盖到'持续运营'，但持续运营之后——客户成功指标、NPS、续约率、扩张收入、Churn预防——完全空白。AI Agent项目的特殊性在于Agent会随模型迭代漂移，需要持续校准，这与企业软件的客户成功有本质区别，但知识库中无对应方法论。", "severity": "medium", "impact": "FDE交付完成后1-3个月内Agent效果衰减的概率极高，但无监控、无校准、无客户预期管理机制，会导致续约率断崖。甘食记、蜀道金租等案例是否经历效果衰减、如何应对，都没有被记录。", "suggestion": "1) 设计'生产级Agent客户成功体系'：Agent效果监控仪表盘、漂移检测机制、季度校准SOP；2) 建立Agent项目特有的NPS问卷与续约预警指标；3) 在每个FDE项目交付时强制嵌入'运营90天启动包'；4) 把客户成功数据回流到FDE方法论迭代中，形成'交付→运营→迭代'的闭环。"}, {"domain": "生物医疗 × AI产业链", "type": "交叉空白", "description": "AI制药被提及但深度不足：cGAS-STING通路的AI辅助药物筛选、Moderna mRNA设计的算力需求、临床数据分析的GPU集群配置等具体场景完全空白。生物医药的研发-生产-商业化全链条与AI算力/模型/数据的对接点没有被系统化。", "severity": "medium", "impact": "赜灵生物、南湖实验室GPAS等项目在AI制药落地时缺乏算力选型、模型适配、数据治理的方法论支撑。AI产业链中的算力出海、Token工厂等服务也无生物医药的细分场景适配案例，错失高价值垂直行业机会。", "suggestion": "1) 建立'AI制药算力需求图谱'：分子模拟/虚拟筛选/ADMET预测/临床数据挖掘等场景的算力配置标准；2) 跟踪Recursion、Insilico Medicine等头部AI制药公司的基础设施架构；3) 在Token工厂客户案例中补充生物医药垂直场景；4) 把刘教授cGAS-STING通路研究作为'AI辅助靶点发现'的标杆案例做方法论沉淀。"}, {"domain": "谈判沟通与学习方法", "type": "有案例无提炼 + 深度不足", "description": "被列为个人知识的关键方法论，但展开度极低。无具体的谈判框架（如BATNA、ZOPA在徐总实际场景中的应用）、无学习方法的工程化（如如何用多智能体加速学习曲线）、无谈判案例的结构化复盘。蜀道集团谈判、政策博弈等高价值场景的谈判复盘未被记录。", "severity": "medium", "impact": "徐总在国资合作、政策资源争取、人才落地谈判中投入大量时间，但每次谈判的经验未被结构化沉淀，下次类似场景仍需从零摸索。承载力的提升需要谈判能力的支撑，而谈判能力的提升需要案例库和方法论。", "suggestion": "1) 把过去3年的关键谈判（蜀道、工信部、刘教授、人才落地等）做完整复盘，提取共性方法论；2) 设计'AI时代谈判三轴模型'（技术理解×商业诉求×政策约束）；3) 把学习方法工程化：用多智能体做'7天攻克一个新领域'的标准流程；4) 与承载力培养路径打通，形成'谈判能力→承载力提升'的正反馈。"}, {"domain": "方法标准/实现标准/对标标准三层分离", "type": "有定义无案例", "description": "作为生产级Agent工程的核心方法论被明确定义，但知识库中没有任何一个Agent项目按这三层标准做过完整对照。'方法标准（应该怎么做）、实现标准（实际怎么做）、对标标准（业界怎么做）'的三层分离在实操中如何落地、产出什么交付物，空白。", "severity": "medium", "impact": "FDE交付物缺乏统一的'三层标准自检'环节，会导致同一团队在不同项目中交付口径不一致。同时也无法向外（客户、行业）输出一套可对比、可审计的标准体系，错失行业话语权机会。", "suggestion": "1) 选择甘食记经营日报Agent作为首个三层标准全对照案例；2) 设计'Agent项目三层标准交付模板'（方法标准白皮书+实现标准代码与配置+对标标准业界横评）；3) 在FDE五阶段方法论中嵌入'三层标准自检'作为第四阶段必选环节；4) 把三层标准沉淀为可对外发布的行业标准草案。"}]};
const insights = {"insights": [{"title": "\"有效产出\"是贯通基建与商业化的统一度量尺——基建侧的MFU和商业化侧的管理闭环描述的是同一道鸿沟", "insight": "AI产业链中'有效算力与MFU'（硬件标称A100算力从上架到商业利用率可能跌至10-20%）和企业AI中'经营参谋vs经营系统'（前者只做信息呈现，后者形成管理闭环）描述的是同一底层结构：名义能力与商业实际产出之间的鸿沟。两者都需要'有效产出'这一统一度量尺——基建侧用MFU+单Token成本商业率，商业化侧用决策命中率+闭环达成率。", "why_important": "目前基建团队和应用团队各自有KPI，导致'基建建得起跑不起'和'应用演示漂亮生产掉链'双重失真同时存在。用统一指标可以让徐总在评估Token工厂投资和FDE项目时用同一把尺子，避免被'标称算力'或'演示Demo'误导。", "action": "立刻构建'有效产出指标矩阵'（V1版）：纵轴是基建（MFU、单Token商业率、推理P99延迟），横轴是商业化（决策命中率、闭环达成率、单闭环ROI）。每个新项目（甘肃庆阳、甘食记、蜀道金租）强制要求按此矩阵自检，作为FDE立项评审的硬性门槛。", "evidence": "AI产业链领域的'有效算力与MFU（从硬件A 级到商业利用率的运营缺口）'；企业AI商业化领域的'经营参谋 vs 经营系统'，前者只做信息呈现，后者形成管理闭环；关系中明确指出两者是'概念同构'关系。"}, {"title": "知识治理成熟度是Agent从'会聊'到'可托付'的真正瓶颈，存在一条单向因果链", "insight": "生产级Agent要求'全局Memory/会话Memory/业务事件Memory'三层分工，但如果没有'强制收口六步法'和一主多从结构做支撑，Agent的Memory层会退化为向量数据库里的噪声。知识治理→Memory质量→Agent可托付程度，是一条单向因果链——也就是说，Agent工程能力的上限被知识治理成熟度直接锁死。", "why_important": "绝大多数Agent团队都在模型微调、Harness工程上砸资源，但忽略了知识治理这个底层瓶颈。这意味着即使徐总拿到最顶级的模型和工程框架，如果Obsidian底座的'收口制度'执行不到位，Agent的可靠性天花板仍然很低。这是从'演示'到'生产'的隐形分水岭。", "action": "在生产级Agent的Memory架构设计中，将Obsidian的'一主多从唯一核心主版本'直接映射为Memory的写入规范：只有经过'强制收口六步法'审核的知识才能进入全局Memory层，未消化的资料只在会话级停留。同时为每个核心概念增加'semantic_action'字段（如甘食记经营日报的MCP流程控制器），让知识库可被Agent直接消费为'操作指令'而非'参考资料'。", "evidence": "知识治理领域的'Skill 与 Memory 分层（全局/会话/业务事件）'与'强制收口六步法（新增/修改/归档与蒸馏）'；生产级Agent工程领域的'生产级 RAG 与数据库知识库架构（事实库/文档知识库/状态机）'；WikiLLM/Karpathy LLM Knowledge Bases 编译方法论的引入。"}, {"title": "低空经济90%巡检数据靠人工二判，是Agent Runtime层缺位的最大空白市场", "insight": "蜀道智巡当前'大疆硬件+凌次方飞控+智巡平台'三层架构是纯IoT逻辑，没有Agent Runtime层——这意味着无人机巡检中90%的数据（实时图像、故障信号、路径异常）需要人工在调度中心二判。生产级Agent的'六层架构（入口/编排/模型/工具/记忆/观测治理）'正好可以填补这个空白，把巡检数据流变成可托付的决策闭环。", "why_important": "这是把蜀道低空业务从'卖硬件+卖航线'升级为'卖运营服务'的关键拐点，决定了低空业务的ROI天花板能否突破硬件销售毛利的上限。同时也是徐总把'生产级Agent工程'从抽象框架转化为可计费商业产品的最佳样板间。", "action": "1）在蜀道智巡项目中试点'巡检Agent V1'：输入是图像流+传感器流，输出是故障分级+处置建议+置信度；2）参照甘食记MCP流程控制器设计'图像识别→异常判定→工单生成→人工复核→闭环归档'的Workflow；3）以蜀道智巡现有航线跑通3-5个真实故障案例；4）把Agent化后的'每公里巡检成本下降比例'作为新计费指标，对标AI产业链的AaaS按结果计费模式，验证商业可行性。", "evidence": "低空经济领域的'蜀交低空/蜀道智巡三层架构（大疆硬件+凌次方飞控+蜀道智巡）'与'大疆机场 3 采购 NPV 三方案对比'；生产级Agent工程领域的'确定性运行时（Workflow/状态机/MCP/质量门禁）'；关系中明确将此标记为'空白交叉'且severity为critical。"}, {"title": "Agent自动决策导致客户损失的责任真空必须在FDE合同中前置解决，否则每个项目都面临法务雷区", "insight": "企业AI追求的是'经营系统级管理闭环'（Agent自动决策、自动执行、自动反馈），而法律体系要求'人类决策权保留'（行政处罚、行政诉讼、责任归属都要求自然人或法人为决策者）。当Agent做出一个导致客户损失的决策时，责任归属完全没有判例或规章覆盖。每个FDE项目都面临这个真空：Agent自动调价导致客户亏损、Agent自动审批导致合规事故、Agent自动关单导致上下游纠纷——一旦发生无任何前置条款可援引。", "why_important": "这直接决定了FDE项目能否签约。一旦客户法务提出'Agent决策谁负责'而我们没有标准答案，要么项目黄掉，要么承担无限连带责任。提前设计'Agent责任分层合同模板'可以同时呼应法律对决策主体的要求、保留Agent的闭环价值、并可作为行业标准模板输出形成壁垒。", "action": "立刻设计'Agent责任分层合同模板V1'：把决策权分为三层——信息呈现层（人负责）、建议层（人审核+Agent辅助）、执行层（Agent负责但设止损规则与置信度门槛）。同时建立'Agent决策可追溯性技术标准'，记录每次决策的输入、依据、置信度、人审节点作为法律证据链。跟踪欧盟AI Act、国内生成式AI管理办法对Agent决策责任的具体要求，保持模板持续迭代。", "evidence": "企业AI商业化的'业务对象化→关系→异常任务动作→反馈规则'闭环逻辑；法律的'七层决策链条'要求决策主体可追溯；关系中已识别'信息呈现层/建议层/执行层'的三层责任分层思路；知识缺口severity为critical。"}, {"title": "生产级Agent与多智能体协作在Harness层存在结构性冲突，需要'两阶段Harness'分层设计", "insight": "生产级Agent追求'确定性运行时（Workflow/状态机/质量门禁）'，要的是'一条线跑到底不出错'；多智能体协作追求'跨项目分诊/路由/多线并行/冲突治理'，要的是'多条线同时跑且能合并'。这两个目标在Harness层会产生结构性冲突：Workflow越严格，并行度越低；并行度越高，状态机越难收敛。这不只是技术问题，而是定义'生产级多智能体系统'的核心命题。", "why_important": "徐总的多智能体协作体系（WorkBuddy+豆包+Codex+Alpha Friday基座）正是踩在这个冲突点上。如果不解决，跨项目并行时的'确定性'无法保证，Agent项目永远停留在单任务Demo级别，无法承接真正的企业级复杂任务。这是把徐总体系从'个人效率工具'升级为'可对外输出的工程标准'的关键。", "action": "设计'两阶段Harness'架构：单任务边界内用确定性Workflow（生产级六层架构标准），跨任务边界用多Agent路由（分诊/汇总/冲突治理）。先在WorkBuddy、Codex多引擎上做小范围验证，验证通过后再封装为'生产级多智能体系统V1'作为FDE交付的标准组件。", "evidence": "生产级Agent工程的'确定性运行时'与'能力阶梯（聊天 AI→Agent→Agent with Harness）'；多智能体协作的'A000 全域总控（跨项目分诊/路由/汇总）'与'多执行线冲突治理'；关系标记为'矛盾张力'且importance为high。"}, {"title": "法律的'四步预判法'是个人的通用决策操作系统，可完整迁移到投资、立项、谈判", "insight": "法律的'四步预判法（定层级→辨形态→看关联→判影响）'本质是一套'信号识别→结构判断→因果推演→影响测算'的通用决策框架，可以完整迁移到个人投资决策、项目立项判断、业务线取舍等场景。配套的'条例/规章/办法/规定 vs 通知/意见/措施/方案'识别口诀，迁移到商业信号解读上就是'合同/白皮书/正式发布 vs 传闻/新闻稿/路演意向'的分级。", "why_important": "徐总同时驱动10个领域的研究与决策，每天面对大量产业信号（Token工厂落地、FDE项目机会、人才落地窗口），缺乏统一框架会导致判断标准漂移、决策质量不稳定。这个迁移让法律领域的'严谨方法论'变成'个人决策肌肉记忆'，可以显著提升判断效率和一致性。", "action": "1）把'四步预判法'封装为标准化工作流模板：每天的产业信号、商业机会、个人重大决策都先用'定层级→辨形态→看关联→判影响'跑一遍；2）在多智能体协作中封装为A000的一个'信号预判'标准命令，让所有项目自动按此框架处理信号；3）建立'信号分级档案'：A级（合同/正式发布）、B级（白皮书/路演）、C级（新闻稿/传闻），不同级别对应不同响应时间窗。", "evidence": "法律领域的'四步预判法（定层级→辨形态→看关联→判影响）'与'识别口诀（条例/规章/办法/规定=有法律效力；通知/意见/措施/方案=政策信号）'；关系标记为'方法论迁移'且importance为high；个人知识领域已有'AI 时代演进史视角下个人实践与产业演进的衔接'作为承接基础。"}, {"title": "个人承载力的内部架构与多智能体协作四层架构同构，可工程化训练", "insight": "多智能体协作的'A000全域总控+项目MC-001+PA/DE/R四角色'与个人知识中'承载力四层能力（压力、人性、混沌中的定力）'在结构上同构——A000对应承载力的'混沌中的定力'层（每日面对混沌信号仍能定方向），MC-001对应'压力承接'层（本周主线的承载），PA/DE对应'人性洞察'层（规划/执行中对人心的把握），R对应'复盘'层。一个人要能像多智能体系统一样长期运转，本质上需要在自己内部实现这套分层。", "why_important": "承载力是徐总同时驱动10个领域的真正瓶颈，但目前停留在'压力、人性、混沌中的定力'四个抽象标签词层面，无任何工程化训练路径。多智能体协作已经实现了工程化，承载力却仍停留在心法——两者形成强烈反差。这个同构让承载力提升有了可操作的工程化路径，而不是停留在鸡汤层面。", "action": "1）把承载力四层能力逐一展开为可观察的行为指标（如'混沌中的定力'=每日三省A000决策与事后回判的一致率）；2）设计'承载力日常训练SOP'：每日三省（A000全域）、每周复盘（MC-001主线）、每季校准（方向）、每事件洞察（人性）；3）沉淀徐总过去处理重大压力的真实案例（蜀道谈判、政策博弈、人才落地等）做案例库；4）建立'个人Agent化心智模型'，把承载力训练做成可观察、可迭代的工程化流程。", "evidence": "多智能体协作领域的'A000 全域总控'与'主控-规划-执行-验收闭环方法'；个人知识领域的'承载力与高阶政治成熟（四层能力+三个心法+边界）'与'Codex 五级用法演进（从单条指令到多智能体生产系统）'；关系标记为'概念同构'且importance为medium。"}, {"title": "创新药真假判断标准可作为Agent真假判断标准的天然对照模板", "insight": "生物医疗的'创新药 vs 科研医药消费品'二分与生产级Agent的'信息层Agent vs 执行层Agent'二分在结构上同构——创新药要求执行层（真正临床有效、可量产、有商业回报），科研消费品停留在信息层（卖论文、卖概念、卖认知）；同理Agent行业里也存在'信息层Agent（演示惊艳、生产掉链）'和'执行层Agent（业务闭环、可托付）'的真假之分。两个领域的真伪判断标准可相互参照、互为佐证。", "why_important": "目前无法快速判断新接触的Agent产品是真闭环还是假闭环，会导致两类严重失误：误把演示型Agent当生产级Agent采购（巨额投资打水漂）、误把执行层Agent当聊天玩具卖低价（错失高价值客户）。生物医药的创新药判断标准已经经过FDA、资本市场多年验证，天然就是Agent真伪判断的成熟参照系。", "action": "立刻建立'创新药×生产级Agent'对照表：左列是创新药的核心特征（机制清晰/临床有效/可量产/有差异化/有商业回报/有专利保护/有学术背书/有监管路径），右列是Agent的对照标准（业务对象化/管理闭环/可工程化/差异化价值/可计费/有知识产权/有案例背书/有合规标准）。用这个表同时过滤生物医疗项目和Agent项目，提升投资和业务判断效率。同时建立'Agent真假十题清单'（有无状态机/有无管理闭环/有无质量门禁/有无止损规则等），对所有Agent案例逐一打标。", "evidence": "生物医疗领域的'创新药 vs 科研医药消费品'与'八项创新药与科研消费品的核心差异'；生产级Agent工程领域的'信息层 Agent vs 执行层 Agent'与'业务分界（数据呈现 vs 管理闭环）'；关系标记为'空白交叉'且importance为medium。"}]};

insights.insights.forEach((ins, i) => {
  const card = document.createElement('div');
  card.className = 'insight-card';
  card.innerHTML = `<div class="title">${i+1}. ${ins.title}</div>

gaps.gaps.forEach((gap, i) => {
  const item = document.createElement('div');
  item.className = 'gap-item';
  const sevClass = 'severity-' + gap.severity;
  item.innerHTML = `<span class="gap-severity ${sevClass}">${gap.severity}</span>
    <div class="desc"><b>${gap.domain}</b> · ${gap.description}</div>
    <div class="suggestion">→ ${gap.suggestion}</div>`;
  gapsBody.appendChild(item);
});

function showInsightDetail(ins) {
  const panel = document.getElementById('relations-panel');
  const body = document.getElementById('relations-body');
  body.innerHTML = `<div class="relation-detail">
    <div class="rtype">💡 关键洞察</div>
    <div class="rinsight"><b>${ins.title}</b><br><br>${ins.insight}</div>
    <div class="revidence">📌 为什么重要：${ins.why_important}</div>
    <div class="revidence">🔍 证据：${ins.evidence}</div>
    <div class="raction">🎯 行动建议：${ins.action}</div>
  </div>`;
  panel.style.display = 'block';
}

function togglePanel(id) {
  document.getElementById(id).classList.toggle('collapsed');
}

// 图谱

chart.setOption({
  backgroundColor: 'transparent',
  tooltip: {
    trigger: 'item',
    backgroundColor: 'rgba(10,10,26,0.95)',
    borderColor: 'rgba(0,212,255,0.3)',
    textStyle: { color: '#fff', fontSize: 12 },
    formatter: function(p) {
      if (p.dataType === 'node') return '<b>' + p.data.name + '</b><br>' + (p.data.value || '');
      if (p.dataType === 'edge') return '<b>' + p.data.source + ' ↔ ' + p.data.target + '</b><br>' + (p.data.value || '');

  },
  series: [{
    type: 'graph',
    layout: 'force',
    data: nodes,
    links: links,
    categories: [{name:'总览'},{name:'领域'}],

    const rel = relations.relations.find(r =>
      (r.source === params.data.source && r.target === params.data.target) ||
      (r.source === params.data.target && r.target === params.data.source));
    if (rel) {
      const panel = document.getElementById('relations-panel');
      const body = document.getElementById('relations-body');
      body.innerHTML = `<div class="relation-detail">
        <div class="rtype">${rel.type}</div>
        <div class="rinsight">${rel.insight}</div>
        <div class="revidence">🔍 证据：${rel.evidence}</div>

      panel.style.display = 'block';
    }

});

window.addEventListener('resize', () => chart.resize());
